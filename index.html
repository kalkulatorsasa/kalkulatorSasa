
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Sasa</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#e2f3ff,#ffffff,#d9efff);
  font-family:'Nunito',sans-serif;
}
.calculator{
  width:100%;
  max-width:340px;
  padding:25px;
  background:#ffffff;
  border-radius:26px;
  box-shadow:0 10px 30px #b9def044;
}
h1{
  margin:0 0 22px;
  text-align:center;
  font-size:27px;
  font-weight:800;
  color:#8fc9ec;
}
#display{
  width:100%;
  height:65px;
  margin-bottom:18px;
  padding:12px;
  border:2px solid #e5f4ff;
  border-radius:16px;
  background:#f8fcff;
  color:#72b2dc;
  text-align:right;
  font-family:'Nunito',sans-serif;
  font-size:27px;
  font-weight:800;
}
.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
button{
  height:56px;
  border:none;
  border-radius:16px;
  background:#f1f9ff;
  color:#83bde2;
  font-family:'Nunito',sans-serif;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 3px 0 #e0f0fb;
}
button:active{transform:scale(.95)}
.operator{background:#dff1ff;color:#78b8df}
.clear{background:#c9e9fc;color:#ffffff}
.equal{
  background:#a9d9f5;
  color:#ffffff;
  grid-row:span 2;
  height:auto;
}
.zero{grid-column:span 2}
.footer{
  margin-top:20px;
  text-align:center;
  color:#a6cde6;
  font-size:12px;
  font-weight:700;
}
</style>
</head>

<body>
<div class="calculator">
  <h1>Kalkulator Sasa</h1>
  <input type="text" id="display" value="0" readonly>

  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">AC</button>
    <button class="operator" onclick="addOperator('/')">÷</button>
    <button class="operator" onclick="addOperator('*')">×</button>
    <button class="operator" onclick="deleteLast()">⌫</button>

    <button onclick="addNumber('7')">7</button>
    <button onclick="addNumber('8')">8</button>
    <button onclick="addNumber('9')">9</button>
    <button class="operator" onclick="addOperator('-')">−</button>

    <button onclick="addNumber('4')">4</button>
    <button onclick="addNumber('5')">5</button>
    <button onclick="addNumber('6')">6</button>
    <button class="operator" onclick="addOperator('+')">+</button>

    <button onclick="addNumber('1')">1</button>
    <button onclick="addNumber('2')">2</button>
    <button onclick="addNumber('3')">3</button>
    <button class="equal" onclick="calculate()">=</button>

    <button class="zero" onclick="addNumber('0')">0</button>
    <button onclick="addNumber('.')">.</button>
  </div>

  <div class="footer">Kalkulator simpel by Sasa</div>
</div>

<script>
let expression='';
const display=document.getElementById('display');

function updateDisplay(){
  display.value=expression||'0';
}

function addNumber(number){
  if(number==='.'&&expression.split(/[+\-*/]/).pop().includes('.'))return;
  expression+=number;
  updateDisplay();
}

function addOperator(operator){
  if(!expression&&operator!=='-')return;
  if(/[+\-*/]$/.test(expression)){
    expression=expression.slice(0,-1);
  }
  expression+=operator;
  updateDisplay();
}

function clearDisplay(){
  expression='';
  updateDisplay();
}

function deleteLast(){
  expression=expression.slice(0,-1);
  updateDisplay();
}

function calculate(){
  try{
    if(!expression||!/^[0-9+\-*/. ]+$/.test(expression))return;
    const result=Function('"use strict";return ('+expression+')')();

    if(!Number.isFinite(result)){
      display.value='Tidak valid';
      expression='';
      return;
    }

    expression=String(Math.round((result+Number.EPSILON)*1e10)/1e10);
    updateDisplay();
  }catch{
    display.value='Error';
    expression='';
  }
}
</script>
</body>
</html>
