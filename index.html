<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Sasa</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #ffe6f2;
  font-family: Arial, sans-serif;
}

.calculator {
  width: 100%;
  max-width: 340px;
  padding: 24px;
  border-radius: 24px;
  background: #ffffff;
  box-shadow: 0 8px 25px #e9a9c8;
}

h1 {
  color: #c21870;
  text-align: center;
  font-size: 25px;
  margin: 0 0 20px;
}

#display {
  width: 100%;
  height: 70px;
  margin-bottom: 16px;
  border: 2px solid #f3a4ca;
  border-radius: 12px;
  padding: 12px;
  font-size: 28px;
  font-weight: bold;
  text-align: right;
  background: #ffffff;
  color: #171717;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  min-width: 0;
  height: 58px;
  border: 1px solid #f2c2d9;
  border-radius: 13px;
  background: #fff0f7;
  color: #25101c;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.96);
}

.operator {
  background: #ffafd2;
  color: #351027;
}

.clear {
  background: #d93682;
  color: #ffffff;
}

.equal {
  background: #a91560;
  color: #ffffff;
}

.zero {
  grid-column: span 2;
}

p {
  margin: 18px 0 0;
  text-align: center;
  color: #8b315d;
  font-size: 12px;
}
</style>
</head>

<body>
<div class="calculator">
  <h1>Kalkulator Sasa</h1>

  <input id="display" value="0" readonly
  aria-label="Layar kalkulator">

  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="del()">⌫</button>
    <button class="operator" onclick="add('/')">÷</button>
    <button class="operator" onclick="add('*')">×</button>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button class="operator" onclick="add('-')">−</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button class="operator" onclick="add('+')">+</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button class="equal" onclick="calculate()">=</button>

    <button class="zero" onclick="add('0')">0</button>
    <button onclick="add('.')">.</button>
  </div>

  <p>Dibuat dengan cinta untuk Sasa</p>
</div>

<script>
let expression = '';
const display = document.getElementById('display');

function add(value) {
  expression += value;
  display.value = expression;
}

function clearDisplay() {
  expression = '';
  display.value = '0';
}

function del() {
  expression = expression.slice(0, -1);
  display.value = expression || '0';
}

function calculate() {
  if (!expression) return;

  if (!/^[0-9+\-*/.() ]+$/.test(expression)) {
    display.value = 'Error';
    expression = '';
    return;
  }

  try {
    const result = Function(
      '"use strict"; return (' + expression + ')'
    )();

    if (!Number.isFinite(result)) {
      throw new Error('Perhitungan tidak valid');
    }

    expression = String(Number(result.toPrecision(12)));
    display.value = expression;
  } catch {
    display.value = 'Error';
    expression = '';
  }
}
</script>
</body>
</html>
