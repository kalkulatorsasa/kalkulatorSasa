<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Sasa</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe6f2;
  font-family: Arial, sans-serif;
}
.calculator {
  width: 320px;
  padding: 22px;
  border-radius: 25px;
  background: white;
  box-shadow: 0 8px 25px #e9a9c8;
}
h1 {
  color: #e7549b;
  text-align: center;
  margin-top: 0;
}
#display {
  width: 100%;
  height: 65px;
  margin-bottom: 15px;
  border: 2px solid #ffc1dd;
  border-radius: 12px;
  padding: 10px;
  font-size: 25px;
  text-align: right;
  background: #fff7fb;
  color: #7d2452;
}
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}
button {
  height: 55px;
  border: none;
  border-radius: 13px;
  background: #ffe0ef;
  color: #8b315d;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
}
button:active {
  transform: scale(0.95);
}
.operator {
  background: #ffafd2;
}<h1>Kalkulator Sasa</h1>
.clear {
  background: #ff80b7;
  color: white;
}
.equal {
  background: #e7549b;
  color: white;
}
.zero {
  grid-column: span 2;
}
p {
  text-align: center;
  color: #d85a96;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="calculator">
  <h1>🎀 Kalkulator Sasa 🎀</h1>
  <input id="display" value="0" readonly>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="del()">⌫</button>
    <button class="operator" onclick="add('/')">÷</button>
    <button class="operator" onclick="add('*')">×</button>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button class="operator" onclick="add('-')">−</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button class="operator" onclick="add('+')">+</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button class="equal" onclick="calculate()">=</button>

    <button class="zero" onclick="add('0')">0</button>
    <button onclick="add('.')">.</button>
  </div>
  <p>♡ Dibuat dengan cinta untuk Sasa ♡</p>
</div>

<script>
let expression = '';
const display = document.getElementById('display');

function add(value) {
  expression += value;
  display.value = expression;
}

function clearDisplay() {
  expression = '';
  display.value = '0';
}

function del() {
  expression = expression.slice(0, -1);
  display.value = expression || '0';
}

function calculate() {
  if (!expression) return;
  if (!/^[0-9+\-*/.() ]+$/.test(expression)) {
    display.value = 'Error';
    expression = '';
    return;
  }
  try {
    const result = Function('"use strict"; return (' + expression + ')')();
    if (!Number.isFinite(result)) throw new Error();
    expression = String(Number(result.toPrecision(12)));
    display.value = expression;
  } catch {
    display.value = 'Error';
    expression = '';
  }
}
</script>
</body>
</html>
